<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ARCADE | CYBERPUNK</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="scanline"></div>
<header class="header">
  <div class="logo">NEON ARCADE <span>CYBERPUNK</span></div>
  <div class="header-actions">
    <div class="players-edit">
      <input id="player1" value="JUGADOR01" maxlength="12"><span class="vs">VS</span><input id="player2" value="JUGADOR02" maxlength="12">
    </div>
    <!-- <button id="themeToggle" class="neon-btn small">DARK</button> -->
  </div>
</header>
<section class="scoreboard" id="scoreboard"></section>
<nav class="tabs">
  <button class="tab active" data-game="tateti">TA-TE-TI</button>
  <button class="tab" data-game="cuatro">4 EN RAYA</button>
  <button class="tab" data-game="sudoku">SUDOKU</button>
</nav>
<main class="game-container">
  <div id="game-tateti" class="game-view active"></div>
  <div id="game-cuatro" class="game-view"></div>
  <div id="game-sudoku" class="game-view"></div>
</main>
<footer class="footer">
  <button id="resetScores" class="neon-btn danger">RESET SCORES</button>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
